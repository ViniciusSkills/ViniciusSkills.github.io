<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
    <title>My Hero Section</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preload" as="image" href="assets/img/hero-image.jpg">

    <style type="text/tailwindcss">
        .hero {
            @apply flex items-center px-6 py-16 md:px-12 relative overflow-hidden;
        }

        .hero-bg-image {
            @apply absolute inset-0 z-0 w-full h-full object-cover object-center;
        }

        .hero-overlay {
            @apply absolute inset-0 z-10 pointer-events-none;
        }

        .hero-content {
            @apply w-full max-w-5xl mx-auto relative z-20;
        }

        .hero-centre {
            @apply text-center;
        }

        .hero-min-height {
            @apply min-h-[480px] md:min-h-[85vh];
        }

        .hero h1 {
            @apply max-w-[20ch] text-4xl font-bold leading-tight md:text-6xl text-white text-shadow-lg/30 font-sans;
            overflow-wrap: anywhere;
            color: #ffffff;
        }

        .hero h2 {
            @apply max-w-[55ch] mt-6 text-lg leading-relaxed md:text-2xl text-white text-shadow-lg/30 font-sans;
            overflow-wrap: anywhere;
            color: #ffffff;
        }

        .hero-centre h1,
        .hero-centre h2 {
            @apply mx-auto;
        }

        .hero-h1-serif {
            @apply font-serif;
        }

        .hero-h2-serif {
            @apply font-serif;
        }
    </style>

    <style>
        #heroHeading {
            letter-spacing: -0.05em;
        }
        #heroSubheading {
            letter-spacing: -0.025em;
        }
        #heroOverlay {
            opacity: 0.4; background-color: #000000;
        }
    </style>
</head>

<body>
    <header class="hero hero-min-height">
        <img src="assets/img/hero-image.jpg" alt="" class="hero-bg-image" aria-hidden="true">
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-content">
            <h1 class="">Lorem ipsum dolor sit amet</h1>
			<h2 class="">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
        </div>
    </header>
</body>
</html>
